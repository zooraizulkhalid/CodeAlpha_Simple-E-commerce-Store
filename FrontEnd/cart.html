<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Your Bag | VOID District</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./cart.css" />

    <script src="./products.js" defer></script>
    <script src="./cart.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./cart-page.js" defer></script>
  </head>

  <body>
    <!-- Header -->
    <!-- Announcement bar -->
    <div class="announcement-bar">
      <p>YOUR STYLE. YOUR RULES. <span>WELCOME TO THE DISTRICT.</span></p>
    </div>

    <!-- Main navigation -->
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <a
          class="brand-logo"
          href="./index.html#home"
          aria-label="VOID District home"
        >
          VOID<span>®</span>
        </a>

        <button
          class="menu-toggle"
          id="menuToggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span>
          <span></span>
        </button>

        <div class="nav-links" id="navLinks">
          <a href="./index.html#home">Home</a>
          <a href="./index.html#categories">Categories</a>
          <a href="./index.html#featured">New drops</a>
          <a href="./index.html#about">Our story</a>
        </div>

        <div class="nav-actions">
          <a
            class="nav-search"
            href="./index.html#featured"
            aria-label="Browse products"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"></circle>
              <path d="m16 16 5 5"></path>
            </svg>
          </a>

          <button
            class="bag-button"
            id="bagButton"
            type="button"
            aria-label="Shopping bag, 0 items"
          >
            BAG <span id="bagCount">0</span>
          </button>
        </div>
      </nav>
    </header>

    <!-- Shopping Cart -->
    <main class="cart-page">
      <div class="container">
        <div class="cart-heading">
          <p class="eyebrow">YOUR SELECTION</p>
          <h1>YOUR <span>BAG.</span></h1>
          <p>Review your pieces before checkout.</p>
        </div>

        <div class="cart-layout">
          <section
            id="cartItems"
            class="cart-items"
            aria-label="Items in your shopping bag"
          ></section>

          <aside class="cart-summary">
            <h2>ORDER SUMMARY</h2>

            <div class="summary-row">
              <span>Total items</span>
              <span id="cartTotalItems">0</span>
            </div>

            <div class="summary-row">
              <span>Subtotal</span>
              <span id="cartSubtotal">Rs. 0</span>
            </div>

            <button
              type="button"
              id="checkoutButton"
              class="checkout-button"
              disabled
            >
              PROCEED TO CHECKOUT
            </button>

            <a href="./index.html#featured" class="continue-shopping">
              CONTINUE SHOPPING
            </a>
          </aside>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>© <span id="currentYear"></span> VOID District.</p>
      </div>
    </footer>
  </body>
</html>
